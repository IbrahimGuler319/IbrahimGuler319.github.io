<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tokat At - Eğlenceli Fotoğraf</title>
<style>
  :root{
    --bg:#0f1724; --card:#0b1220; --accent:#4cc9f0; --muted:#9aa8c3;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg,#071022 0%, #081424 60%);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    color:#e6f0fb;
    padding:24px;
  }

  .wrap{
    width:100%;
    max-width:980px;
    display:grid;
    grid-template-columns: 1fr 360px;
    gap:28px;
    align-items:start;
  }

  /* SOLDAN FOTOĞRAF KARTI */
  .photo-card{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px solid rgba(255,255,255,0.04);
    border-radius:14px;
    padding:18px;
    position:relative;
    overflow:hidden;
  }

  .frame{
    width:100%;
    aspect-ratio: 4/3;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.0));
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 -50px 80px rgba(0,0,0,0.2);
    border: 1px solid rgba(76,201,240,0.06);
  }

  /* Resim kendisi */
  #targetImage{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    transition: transform 240ms cubic-bezier(.2,.8,.2,1), filter 240ms;
    will-change: transform, filter;
    display:block;
    border-radius:6px;
  }

  /* Tokat el svg (başlangıçta gizli) */
  .hand{
    position:absolute;
    width:240px;
    height:220px;
    right:-260px;
    top:30%;
    transform-origin: 90% 50%;
    pointer-events:none;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.6));
    opacity:0;
  }

  /* slap animasyonu tetiklenince eklenen sınıf */
  .slap .hand{
    animation:hand-slap 520ms cubic-bezier(.1,.9,.2,1) forwards;
    opacity:1;
  }

  @keyframes hand-slap{
    0% { transform: translateX(0) rotate(-12deg) scale(0.95); right:-260px; opacity:1; }
    35% { right: 20px; transform: translateX(-10px) rotate(6deg) scale(1.05); }
    60% { right: -40px; transform: translateX(10px) rotate(-6deg) scale(0.98); }
    100% { right:-260px; transform: translateX(0) rotate(-12deg) scale(0.95); opacity:0; }
  }

  /* Fotoğrafın vurulma efektleri (kısa sallanma & blur) */
  .slap #targetImage{
    animation: img-hit 520ms cubic-bezier(.2,.8,.2,1);
    filter: brightness(1.05) saturate(1.05);
  }
  @keyframes img-hit{
    0% { transform: translateX(0) rotate(0) scale(1); }
    20% { transform: translateX(-8px) rotate(-3deg) scale(1.02); }
    40% { transform: translateX(10px) rotate(2deg) scale(1.01); }
    60% { transform: translateX(-6px) rotate(-1deg) scale(1.005); }
    100% { transform: translateX(0) rotate(0) scale(1); }
  }

  /* Sağdaki kontrol paneli */
  .panel{
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-radius:14px;
    padding:18px;
    border:1px solid rgba(255,255,255,0.03);
    min-height: 260px;
  }
  .panel h3{
    margin:0 0 12px 0;
    color:var(--accent);
    font-size:1.05rem;
  }

  .controls{ display:flex; gap:10px; flex-wrap:wrap }
  .btn{
    background:linear-gradient(180deg,var(--accent), #2fb6db);
    color:#042028;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(47,182,219,0.18);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s;
  }
  .btn:active{ transform: translateY(2px) }
  .btn.ghost{ background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--muted); box-shadow:none }

  .meta{ margin-top:14px; color:var(--muted); font-size:0.92rem }

  .count{
    display:flex; align-items:center; gap:12px; margin-top:10px;
    font-size:1.1rem; font-weight:700; color:#cfeffd;
  }

  /* Uçan emoji */
  .emoji{
    position:absolute;
    font-size:36px;
    pointer-events:none;
    will-change: transform, opacity;
    text-shadow: 0 6px 18px rgba(0,0,0,0.45);
  }

  /* Konfeti (canvas) */
  canvas#confetti{
    position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:40;
  }

  /* Küçük not */
  .hint{ font-size:0.85rem; color:var(--muted); margin-top:12px }

  /* Responsive */
  @media (max-width:900px){
    .wrap{ grid-template-columns:1fr; }
    .panel{ order:2 }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- FOTO KART -->
  <div class="photo-card" id="photoCard">
    <div class="frame" id="frame">
      <!-- Kullanıcının yüklediği resim buraya gelecek -->
      <img id="targetImage" src="friend.jpg" alt="Fotoğraf yüklü değil" crossorigin="anonymous" />
      <!-- Tokat elini SVG ile çiziyoruz (stil ve anim var) -->
      <svg class="hand" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Basit el/avuç çizimi -->
        <g transform="translate(0,10)">
          <path d="M160 70c0 40-30 72-70 72-35 0-64-27-68-61 -1-9 6-18 15-19 6-1 10 2 15 6 6 5 13 7 21 7 6 0 15-2 21-8 6-6 9-13 16-19 7-6 18-6 25 0 12 10 26 15 25 22z" fill="#ffd9c7"/>
          <path d="M40 30c-2-8 4-16 12-18 8-2 15 3 17 11l3 18" fill="#ffd9c7"/>
          <path d="M68 20c5-12 18-17 30-12 6 3 10 8 12 14 4 12-1 26-13 30s-31 2-39-9c-3-4-3-10 0-18z" fill="#ffd9c7"/>
          <!-- el gölgesi -->
          <ellipse cx="95" cy="135" rx="70" ry="30" fill="rgba(0,0,0,0.25)"/>
        </g>
      </svg>

      <!-- konfeti canvas -->
      <canvas id="confetti"></canvas>
    </div>
    <div style="margin-top:14px; display:flex; gap:10px; align-items:center; justify-content:space-between;">
      <div>
        <label style="display:block; font-size:0.85rem; color:var(--muted)">Fotoğraf Yükle</label>
        <input id="fileInput" type="file" accept="image/*" style="margin-top:6px; color:transparent" />
        <p class="hint">Veya tarayıcıda aynı klasörde <code>friend.jpg</code> adında bir dosya bulundur.</p>
      </div>
      <div style="text-align:right">
        <div style="font-size:0.82rem; color:var(--muted)">Toplam Tokat</div>
        <div id="slapCount" class="count">0</div>
      </div>
    </div>
  </div>

  <!-- KONTROL PANEL -->
  <aside class="panel">
    <h3>Tokat Paneli</h3>
    <div class="controls">
      <button id="slapBtn" class="btn">TOKAT AT! 👋</button>
      <button id="burstBtn" class="btn ghost">Çılgın Mod (Konfeti)</button>
      <button id="resetBtn" class="btn ghost">Sayaçı Sıfırla</button>
    </div>

    <div class="meta">
      <div style="margin-top:12px;">
        <strong>İpucu:</strong> Boşluk tuşuna (Space) da basabilirsin.
      </div>

      <div style="margin-top:12px;">
        <label style="display:block; font-size:0.9rem; color:var(--muted)">Rastgele Tepkiler</label>
        <div id="msgBox" style="margin-top:6px; color:#c9f2ff; font-weight:700">Hazır...</div>
      </div>
      <div style="margin-top:14px;">
        <label style="display:block; font-size:0.9rem; color:var(--muted)">Ses Seviyesi</label>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.6" />
      </div>
    </div>
  </aside>
</div>

<script>
/*
  Tek dosyalık "Tokat At" sayfası
  - Fotoğraf yükleme
  - El animasyonu (SVG)
  - Konfeti canvas
  - Basit tokat sesi (WebAudio)
  - Uçan emoji efektleri + rastgele mesajlar
*/

// DOM
const fileInput = document.getElementById('fileInput');
const img = document.getElementById('targetImage');
const photoCard = document.getElementById('photoCard');
const slapBtn = document.getElementById('slapBtn');
const burstBtn = document.getElementById('burstBtn');
const resetBtn = document.getElementById('resetBtn');
const slapCountEl = document.getElementById('slapCount');
const msgBox = document.getElementById('msgBox');
const confettiCanvas = document.getElementById('confetti');
const vol = document.getElementById('vol');

let slapCount = 0;
let confettiOn = false;

// Foto yükleme
fileInput.addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    img.src = ev.target.result;
  };
  reader.readAsDataURL(f);
});

// Rastgele mesajlar
const messages = [
  "Oof! 🤭", "Hahaha! 😂", "Burası acıyor mu? 😅", "Yumuşak dokunuş 🧴", "Güçlü vuruş 💥",
  "Ha! İşte bu! 👏", "Yuh! Çok sert 😜", "Tekrar dene! 🔁", "Komik değil ama olsun 🤪", "GG WP ✨"
];

// Uçan emoji üret
function spawnEmoji(x,y){
  const el = document.createElement('div');
  el.className = 'emoji';
  el.textContent = ['👋','💥','👏','🤣','🔥'][Math.floor(Math.random()*5)];
  document.body.appendChild(el);
  // başlangıç pozisyonu (yaklaşık elin değdiği nokta)
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  requestAnimationFrame(()=>animateEmoji(el));
  setTimeout(()=>el.remove(), 1600);
}
function animateEmoji(el){
  const sx = parseFloat(el.style.left);
  const sy = parseFloat(el.style.top);
  const dx = sx + (Math.random()*160 - 80);
  const dy = sy - (100 + Math.random()*100);
  el.animate([
    { transform: 'translate(0,0) scale(1)', opacity:1 },
    { transform: `translate(${dx-sx}px, ${dy-sy}px) scale(1.4)`, opacity:0.02 }
  ], { duration: 1200, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

// Basit konfeti (particle) sistemi
const confettiCtx = confettiCanvas.getContext('2d');
function resizeConfetti(){
  confettiCanvas.width = confettiCanvas.clientWidth;
  confettiCanvas.height = confettiCanvas.clientHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

let particles = [];
function startConfettiBurst(){
  const w = confettiCanvas.width, h = confettiCanvas.height;
  particles = [];
  const count = 50 + Math.floor(Math.random()*80);
  for(let i=0;i<count;i++){
    particles.push({
      x: Math.random()*w,
      y: -20 - Math.random()*h*0.2,
      vx: (Math.random()-0.5)*6,
      vy: 2 + Math.random()*6,
      size: 6 + Math.random()*10,
      color: ['#4cc9f0','#48cae4','#3a86ff','#ade8f4','#ffd166'][Math.floor(Math.random()*5)]
    });
  }
  confettiOn = true;
  requestAnimationFrame(confettiLoop);
}
function confettiLoop(){
  if(!confettiOn) return;
  confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  for(let p of particles){
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.08;
    confettiCtx.fillStyle = p.color;
    confettiCtx.fillRect(p.x, p.y, p.size, p.size*0.6);
  }
  // fade out when beyond
  particles = particles.filter(p => p.y < confettiCanvas.height+40);
  if(particles.length === 0){
    confettiOn = false;
    confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  } else {
    requestAnimationFrame(confettiLoop);
  }
}

// WebAudio ile tokat sesi oluştur
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function playSlapSound(volume = 0.6){
  if(!AudioCtx) return;
  if(!audioCtx) audioCtx = new AudioCtx();
  const now = audioCtx.currentTime;

  // kısa 'pop' için beyaz gürültü + percussive envelope
  const bufferSize = audioCtx.sampleRate * 0.05;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for(let i=0;i<data.length;i++){
    data[i] = (Math.random()*2 -1) * (1 - i/data.length); // fade out
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuffer;

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(volume*0.9, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

  noise.connect(noiseGain).connect(audioCtx.destination);
  noise.start(now); noise.stop(now + 0.06);

  // ek bir kısa tonal click
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(800, now);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(volume*0.5, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.06);
}

// Ana tokat fonksiyonu
function doSlap(x = null, y = null){
  // görsel sınıf ekle
  photoCard.classList.add('slap');
  // rastgele mesaj
  msgBox.textContent = messages[Math.floor(Math.random()*messages.length)];
  // sayı arttır
  slapCount++;
  slapCountEl.textContent = slapCount;
  // uçan emoji
  const rect = img.getBoundingClientRect();
  const px = x !== null ? x : rect.left + rect.width*0.7;
  const py = y !== null ? y : rect.top + rect.height*0.35;
  spawnEmoji(px, py);
  // konfeti
  if(confettiOn === false && burstToggle) startConfettiBurst();

  // ses
  const v = parseFloat(vol.value || 0.6);
  playSlapSound(v);

  // kısa titreşim hissi için hafif vignette (ara)
  setTimeout(()=> photoCard.classList.remove('slap'), 700);
}

// Butonlar
let burstToggle = false;
slapBtn.addEventListener('click', ()=>{
  // elin vuracağı yaklaşık koordinatı hesapla
  const r = img.getBoundingClientRect();
  const tx = r.left + r.width*0.6;
  const ty = r.top + r.height*0.35;
  doSlap(tx, ty);
});
burstBtn.addEventListener('click', ()=>{
  burstToggle = !burstToggle;
  burstBtn.textContent = burstToggle ? 'Çılgın Mod Açık 🎉' : 'Çılgın Mod (Konfeti)';
  burstBtn.classList.toggle('active', burstToggle);
  if(burstToggle) startConfettiBurst();
});
resetBtn.addEventListener('click', ()=>{
  slapCount = 0;
  slapCountEl.textContent = slapCount;
  msgBox.textContent = 'Sıfırlandı ✅';
});

// Space tuşu ile tetikleme
window.addEventListener('keydown', e=>{
  if(e.code === 'Space'){ e.preventDefault(); slapBtn.click(); }
});

// Sayfa yüklenince default mesaj
msgBox.textContent = 'Fotoğrafı yükle ve "TOKAT AT" a bas!';

// Mobilde tıklama alanı kolay olsun: fotoğrafa dokununca da tokat
img.addEventListener('click', (ev)=>{
  doSlap(ev.clientX, ev.clientY);
});

// Başlangıçta friend.jpg yoksa hafif opak placeholder uygula
img.onerror = ()=> {
  img.src = '';
  img.alt = 'Fotoğraf bulunamadı — lütfen yükleyin';
  img.style.opacity = 0.12;
  img.style.background = 'linear-gradient(90deg, rgba(76,201,240,0.06), rgba(58,134,255,0.04))';
};


// Basit: resim yüklendikten sonra opaklığı normale çevir
img.addEventListener('load', ()=> {
  img.style.opacity = 1;
  img.style.background = 'transparent';
});

// Çeşitli küçük görsel dokunuş: el animasyonunu tetiklediğimizde hand sınıfı SVG içinde yönetiliyor
// (Bu kontrol CSS .slap sınıfına göre yapılıyor).

</script>
</body>
</html>
